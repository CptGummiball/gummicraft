name: Neuesten Changelog auf Discord posten

on:
  push:
    branches:
      - main
    paths:
      - CHANGELOG.md
permissions:
  contents: read

jobs:
  post-changelog:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Neuesten Changelog-Eintrag senden
        env:
          DISCORD_WEBHOOK_URL_2: ${{ secrets.DISCORD_WEBHOOK_URL_2 }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          python3 <<'PYTHON'
          import json
          import os
          import re
          import time
          import urllib.request

          changelog_path = "CHANGELOG.md"

          with open(changelog_path, "r", encoding="utf-8") as file:
              changelog = file.read()

          # Ersten Abschnitt finden, der mit einer ##-Überschrift beginnt.
          match = re.search(
              r"(?ms)^##[ \t]+.+?(?=^##[ \t]+|\Z)",
              changelog
          )

          if not match:
              raise SystemExit(
                  "Kein Changelog-Eintrag mit einer ##-Überschrift gefunden."
              )

          newest_entry = match.group(0).strip()
          repository_url = os.environ["REPOSITORY_URL"]

          message = (
              f"**Neues Changelog-Update**\n\n"
              f"{newest_entry}\n\n"
              f"🔗 {repository_url}/blob/main/CHANGELOG.md"
          )

          webhook_url = os.environ["DISCORD_WEBHOOK_URL_2"]

          if not webhook_url:
              raise SystemExit("Das Secret DISCORD_WEBHOOK_URL_2 fehlt.")

          # Discord erlaubt maximal 2.000 Zeichen pro normaler Nachricht.
          # Längere Einträge werden deshalb auf mehrere Nachrichten verteilt.
          chunks = []

          while message:
              if len(message) <= 1900:
                  chunks.append(message)
                  break

              split_at = message.rfind("\n", 0, 1900)

              if split_at == -1:
                  split_at = message.rfind(" ", 0, 1900)

              if split_at == -1:
                  split_at = 1900

              chunks.append(message[:split_at].rstrip())
              message = message[split_at:].lstrip()

          for index, chunk in enumerate(chunks):
              payload = json.dumps({
                  "content": chunk,
                  "allowed_mentions": {
                      "parse": []
                  }
              }).encode("utf-8")

              request = urllib.request.Request(
                  webhook_url,
                  data=payload,
                  headers={
                      "Content-Type": "application/json",
                      "User-Agent": "GitHub-Changelog-Webhook"
                  },
                  method="POST"
              )

              with urllib.request.urlopen(request) as response:
                  if response.status not in (200, 204):
                      raise RuntimeError(
                          f"Discord antwortete mit Status {response.status}."
                      )

              if index < len(chunks) - 1:
                  time.sleep(1)

          print("Der neueste Changelog-Eintrag wurde veröffentlicht.")
          PYTHON
